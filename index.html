<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il mio amore 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  background: #fff0f6;
  font-family: Georgia, serif;
  color: #87435f;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  position: relative;
  width: 94vw;
  height: 94vh;
  max-width: 720px;
  max-height: 760px;
  overflow: hidden;
  text-align: center;
  border-radius: 30px;
  background: linear-gradient(#fff8fb, #ffe5f0);
  box-shadow: 0 10px 40px rgba(200,63,120,.25);
}

h1 {
  margin: 35px 10px 5px;
  font-size: clamp(28px, 7vw, 46px);
  color: #c83f78;
}

.subtitle {
  margin: 0 20px;
  font-size: clamp(16px, 4vw, 22px);
}

.tree {
  position: absolute;
  left: 50%;
  bottom: 90px;
  transform: translateX(-50%);
  width: 270px;
  height: 430px;
}

.trunk {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 45px;
  height: 220px;
  transform: translateX(-50%);
  background: linear-gradient(90deg,#71352f,#b86b61,#71352f);
  border-radius: 20px 20px 5px 5px;
}

.branch {
  position: absolute;
  height: 17px;
  background: #814039;
  border-radius: 20px;
  transform-origin: left center;
}

.b1 {
  width: 140px;
  left: 135px;
  bottom: 155px;
  transform: rotate(-135deg);
}

.b2 {
  width: 120px;
  left: 135px;
  bottom: 195px;
  transform: rotate(-160deg);
}

.b3 {
  width: 115px;
  left: 135px;
  bottom: 125px;
  transform: rotate(150deg);
}

.flower {
  position: absolute;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background:
    radial-gradient(circle,
    #7d3154 0 10%,
    #ff8fba 11% 35%,
    #ffb6d1 36% 65%,
    #ffd7e7 66%);
  filter: drop-shadow(0 2px 3px rgba(160,40,90,.25));
  animation: sway 3s ease-in-out infinite alternate;
}

@keyframes sway {
  to {
    transform: translateY(5px) rotate(5deg);
  }
}

.petal {
  position: absolute;
  top: -50px;
  font-size: 23px;
  animation: fall linear infinite;
}

@keyframes fall {
  0% {
    transform: translateY(-50px) rotate(0deg);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  100% {
    transform: translateY(850px) translateX(100px) rotate(360deg);
    opacity: 0;
  }
}

.message {
  position: absolute;
  bottom: 35px;
  left: 15px;
  right: 15px;
  font-size: clamp(16px,4vw,23px);
}

#days {
  margin-top: 7px;
  font-size: clamp(21px,5vw,30px);
  font-weight: bold;
  color: #c83f78;
}

.bottom {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 55px;
  font-size: 30px;
  letter-spacing: 5px;
}
</style>
</head>

<body>

<div class="card">

  <h1>🌸 Il mio amore 🌸</h1>

  <div class="subtitle">
    è iniziato per te il <b>19 dicembre</b> 💗
  </div>

  <div class="tree">

    <div id="canopy"></div>

    <div class="branch b1"></div>
    <div class="branch b2"></div>
    <div class="branch b3"></div>

    <div class="trunk"></div>

  </div>

  <div class="message">
    Il mio amore è iniziato per te il 19 dicembre.
    <div id="days"></div>
  </div>

  <div class="bottom">
    🌸 🌷 🌸 🌷 🌸 🌷 🌸
  </div>

</div>

<script>

const oggi = new Date();

let inizio = new Date(
  oggi.getFullYear(),
  11,
  19
);

if (oggi < inizio) {
  inizio.setFullYear(oggi.getFullYear() - 1);
}

const differenza =
  oggi.setHours(0,0,0,0) -
  inizio.setHours(0,0,0,0);

const giorni =
  Math.floor(differenza / 86400000);

document.getElementById("days").textContent =
  giorni + " giorni insieme 💗";


const canopy =
  document.getElementById("canopy");

for (let i = 0; i < 65; i++) {

  const fiore =
    document.createElement("div");

  fiore.className = "flower";

  fiore.style.left =
    (Math.random() * 220 + 20) + "px";

  fiore.style.top =
    (Math.random() * 290 + 5) + "px";

  const grandezza =
    0.45 + Math.random() * 0.65;

  fiore.style.transform =
    "scale(" + grandezza + ")";

  fiore.style.animationDelay =
    (Math.random() * 3) + "s";

  canopy.appendChild(fiore);
}


for (let i = 0; i < 30; i++) {

  const petalo =
    document.createElement("div");

  petalo.className = "petal";

  petalo.textContent = "🌸";

  petalo.style.left =
    Math.random() * 100 + "vw";

  petalo.style.animationDuration =
    (5 + Math.random() * 8) + "s";

  petalo.style.animationDelay =
    (-Math.random() * 12) + "s";

  document.body.appendChild(petalo);
}

</script>

</body>
</html>
